services:
  backend:
    build: .
    ports: ["8000:8000"]
    env_file:
      - path: .env
        required: false
    volumes: ["vesper-data:/app/data"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  vesper-data:
